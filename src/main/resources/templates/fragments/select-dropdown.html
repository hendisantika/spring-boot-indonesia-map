<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="dropdown">
    <label class="w3-text-theme">
        <b><i th:class="'fa ' + ${icon}"></i> <span th:text="${label}">Label</span></b>
    </label>
    <select class="w3-select w3-border w3-round w3-margin-bottom"
            th:id="${type} + '-select'"
            th:data-type="${type}"
            onchange="handleSelectChange(this)">
        <option value="">Pilih <span th:text="${label}">Label</span></option>
        <option th:each="item : ${items}"
                th:value="${item.code}"
                th:text="${item.name}">
        </option>
    </select>
</div>
</body>
</html>
