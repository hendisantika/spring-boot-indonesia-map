spring.application.name=spring-boot-indonesia-map

# Server
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false

# Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=3600s

# Logging
logging.level.id.my.hendisantika.indonesiamap=DEBUG

# Connection timeout for RestClient
spring.mvc.async.request-timeout=30000
